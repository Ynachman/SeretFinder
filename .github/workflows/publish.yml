# Twice daily, entirely on GitHub (no PC needed):
#   scrape seret.co.il (plain HTTP, ~2 min) -> update Neon (adds new screenings,
#   removes cancelled ones) -> ratings -> export site/data.json -> GitHub Pages.
#
# Needs repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL   Neon connection string (postgresql+psycopg2://...)
#   TMDB_API_KEY   TMDB key
#   OMDB_API_KEY   OMDb key (Rotten Tomatoes; optional)
# and Settings -> Pages -> Source = "GitHub Actions".
name: Publish

on:
  schedule:
    - cron: "0 4 * * *"        # ~06:00/07:00 in Israel
    - cron: "0 16 * * *"       # ~18:00/19:00 in Israel
  workflow_dispatch:            # "Run workflow" button (or: gh workflow run publish.yml)
  push:                         # app changes: republish without re-scraping
    branches: [main, master]
    paths: ["site/**", "scraper/export.py", ".github/workflows/publish.yml"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write                # keep-alive below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape, ingest, geocode, ratings
        if: github.event_name != 'push'
        # If the scrape fails, still publish the existing data below; the app
        # shows a "not updated" warning once data is more than two days old.
        continue-on-error: true
        run: python -m scraper.refresh

      - name: Keep scraper debug pages (if any)
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: debug/
          retention-days: 7

      - name: Export site/data.json
        run: python -m scraper.export

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # commits. Re-enabling this workflow via the API resets that counter.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
