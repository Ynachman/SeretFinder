# Publish the static app to GitHub Pages (free, global CDN, no server to wake up).
#
# Scraping does NOT happen here: seret.co.il's Cloudflare shows a bot check to
# cloud/datacenter IPs such as GitHub's runners. Your PC scrapes instead
# (python -m scraper.refresh --publish, via scripts/schedule_daily_refresh.ps1),
# writes to Neon, and then triggers this workflow, which exports Neon ->
# site/data.json and deploys. It also runs daily on its own so past showtimes
# drop off even on days the PC was off.
#
# Needs repository secret DATABASE_URL (Settings -> Secrets and variables ->
# Actions) and Settings -> Pages -> Source = "GitHub Actions".
name: Publish

on:
  schedule:
    - cron: "30 4 * * *"       # 04:30 UTC = 06:30/07:30 in Israel
  workflow_dispatch:            # triggered by the PC after each scrape (or by hand)
  push:                         # app changes: republish
    branches: [main, master]
    paths: ["site/**", "scraper/export.py", ".github/workflows/publish.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export site/data.json from Neon
        run: python -m scraper.export

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
