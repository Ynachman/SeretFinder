# Temporary diagnostic: which seret.co.il pages does Cloudflare serve normally
# to GitHub's runners (no browser, plain HTTP)? Delete after use.
name: Diagnose seret access
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - shell: python
        run: |
          import re, requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          s = requests.Session(); s.headers.update({"User-Agent": UA, "Accept-Language": "he-IL,he;q=0.9"})
          def probe(label, url):
              try:
                  r = s.get(url, timeout=30)
                  t = re.search(r"<title>(.*?)</title>", r.text, re.S)
                  print(f"{label}: HTTP {r.status_code} len={len(r.text)} title={(t.group(1).strip()[:60] if t else None)!r} "
                        f"challenge={'Just a moment' in r.text} movie_links={r.text.count('s_movies.asp')} "
                        f"cinema_cards={r.text.count('mvt-n')} slots={r.text.count('stbox')}")
                  return r.text
              except Exception as e:
                  print(f"{label}: ERROR {type(e).__name__}")
                  return ""
          idx = probe("index", "https://www.seret.co.il/movies/newmovies.asp")
          mids = list(dict.fromkeys(re.findall(r"s_movies\.asp\?MID=(\d+)", idx)))[:3] or ["8601"]
          for mid in mids:
              probe(f"ajax MID={mid}", f"https://www.seret.co.il/movies/showTimesAjaxMovies.asp?MID={mid}&d=&s=&v=&st=")
          probe(f"movie page MID={mids[0]}", f"https://www.seret.co.il/movies/s_movies.asp?MID={mids[0]}")
